[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

# Astro fingerprints filenames in /_astro/ (e.g. index.abc123.css), so a new
# build produces a new filename. Caching these forever is safe and is the
# single biggest perf win available here.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are fingerprinted the same way.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must never be cached long — it's what points at the fingerprinted
# assets above, so a stale copy pins visitors to an old build.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Two conservative security headers. Deliberately NO Content-Security-Policy:
# this site frames reliefroute.unityprovisions.org, a Google Sheet, and
# youtube-nocookie.com, and an untested CSP would silently break all three.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"